<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Funscript Player – Your video. Your devices. Perfectly in sync.">
  <defs>
    <radialGradient id="bg" cx="25%" cy="20%" r="95%">
      <stop offset="0" stop-color="#5a1f4a"/>
      <stop offset=".45" stop-color="#1d1236"/>
      <stop offset="1" stop-color="#07060c"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4f9a"/>
      <stop offset=".6" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".1"/>
      <stop offset=".35" stop-color="#22d3ee"/>
      <stop offset=".7" stop-color="#ff4f9a"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity=".1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <!-- Funscript als Welle -->
  <polyline filter="url(#glow)" fill="none" stroke="url(#wave)" stroke-width="4" stroke-linejoin="round"
    points="0,330 60,300 110,350 170,280 220,345 280,270 330,350 390,250 440,350 500,262 560,340 620,240 680,352 740,256 800,338 860,270 920,350 980,282 1040,340 1100,295 1160,345 1220,310 1280,330"/>
  <text x="80" y="150" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" fill="#f5f3ff">Funscript <tspan fill="#e0457b">Player</tspan></text>
  <text x="84" y="205" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="30" fill="#c9c4e0">Your video. Your devices. Perfectly in sync.</text>
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#f5f3ff">
    <rect x="84" y="232" width="162" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="104" y="256">↕ The Handy</text>
    <rect x="258" y="232" width="150" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="278" y="256">〰 Satisfyer</text>
    <rect x="420" y="232" width="110" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="440" y="256">📚 Stash</text>
    <rect x="542" y="232" width="170" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="562" y="256">🐳 Self-hosted</text>
  </g>
  <!-- Geräte-Ringe -->
  <g transform="translate(1040 150)" filter="url(#glow)">
    <circle r="78" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="12"/>
    <circle r="78" fill="none" stroke="#e0457b" stroke-width="12" stroke-linecap="round" stroke-dasharray="304 490" transform="rotate(-90)"/>
    <circle r="56" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="10"/>
    <circle r="56" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-dasharray="270 352" transform="rotate(-90)"/>
  </g>
  <text x="1040" y="160" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f5f3ff">62 %</text>
</svg>
