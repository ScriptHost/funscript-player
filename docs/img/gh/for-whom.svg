<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="Who is it for: just a Handy, just a Satisfyer, a Stash library" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#ff5c93"/><stop offset="1" stop-color="#a07bff"/></linearGradient>
  
</defs>
<g transform="translate(0 0)">
  <rect x="1" y="1" width="306" height="218" rx="18" fill="#1a1d23" stroke="#2c313b" stroke-width="2"/>
  
  
  
  <text x="18" y="40" font-size="19" font-weight="700" fill="#e8eaed">↕ Just a Handy</text>
  <text x="18" y="70" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="start"><tspan x="18" dy="0">Clean sync via the Handy cloud,</tspan><tspan x="18" dy="24">scripts corrected automatically,</tspan><tspan x="18" dy="24">0.5×–2× speed without drift –</tspan><tspan x="18" dy="24">and the library shows you</tspan><tspan x="18" dy="24">beforehand how intense a scene</tspan><tspan x="18" dy="24">is.</tspan></text>
</g>
<g transform="translate(326 0)">
  <rect x="1" y="1" width="306" height="218" rx="18" fill="#1a1d23" stroke="#2c313b" stroke-width="2"/>
  
  
  
  <text x="18" y="40" font-size="19" font-weight="700" fill="#e8eaed">〰 Just a Satisfyer</text>
  <text x="18" y="70" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="start"><tspan x="18" dy="0">You don’t need vibration</tspan><tspan x="18" dy="24">scripts: every Handy script</tspan><tspan x="18" dy="24">becomes vibration live. Connects</tspan><tspan x="18" dy="24">via Bluetooth right in the</tspan><tspan x="18" dy="24">browser, no app.</tspan></text>
</g>
<g transform="translate(652 0)">
  <rect x="1" y="1" width="306" height="218" rx="18" fill="#1a1d23" stroke="#2c313b" stroke-width="2"/>
  
  
  
  <text x="18" y="40" font-size="19" font-weight="700" fill="#e8eaed">📚 A Stash library</text>
  <text x="18" y="70" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="start"><tspan x="18" dy="0">Scenes with Funscript, heatmap</tspan><tspan x="18" dy="24">and intensity at a glance.</tspan><tspan x="18" dy="24">Ratings, favourites and markers</tspan><tspan x="18" dy="24">go back to Stash – also from VR</tspan><tspan x="18" dy="24">via HereSphere.</tspan></text>
</g>
</svg>
