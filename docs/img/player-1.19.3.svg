<svg xmlns="http://www.w3.org/2000/svg" viewBox="496 16 758 728" width="758" height="728" role="img" aria-label="Funscript Player 1.19.2 on a phone: player with script box and library">
  <!-- Nachbau der echten Oberfläche 1.19.3 (Farben aus public/style.css) – Player und Bibliothek am Smartphone -->
  <defs>
    <linearGradient id="heat" x1="0" x2="1">
      <stop offset="0" stop-color="#1e90ff"/><stop offset=".16" stop-color="#28c864"/><stop offset=".3" stop-color="#f0d228"/>
      <stop offset=".42" stop-color="#fa821e"/><stop offset=".52" stop-color="#e62832"/><stop offset=".62" stop-color="#fa821e"/>
      <stop offset=".74" stop-color="#28c864"/><stop offset=".86" stop-color="#e62832"/><stop offset="1" stop-color="#1e90ff"/>
    </linearGradient>
    <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f4b"/><stop offset=".55" stop-color="#1f232b"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5368"/><stop offset="1" stop-color="#1b1e24"/></linearGradient>
    <linearGradient id="t2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4a52"/><stop offset="1" stop-color="#1b1e24"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2f4a4a"/><stop offset="1" stop-color="#1b1e24"/></linearGradient>
    <clipPath id="scr"><rect width="330" height="680" rx="26"/></clipPath>
  </defs>
  <rect width="1280" height="760" rx="24" fill="#0b0c0f"/>

  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Roboto, sans-serif" fill="#e6e8eb">
    <!-- Text links -->
    <text x="72" y="150" font-size="44" font-weight="800">Funscript <tspan fill="#e0457b">Player</tspan></text>
    <text x="74" y="190" font-size="20" fill="#8b929c">Version 1.19.3 – as it looks today</text>
    <g font-size="19">
      <text x="74" y="262">↕ The Handy + 〰 Satisfyer from one script</text>
      <text x="74" y="302">🎚 Original · Automatic · Gentle · Intense</text>
      <text x="74" y="342">✋ Control yourself and record it</text>
      <text x="74" y="382">🔥 Heatmap, hottest spots, Finale</text>
      <text x="74" y="422">📚 Stash + folders, intensity, 2D-only</text>
      <text x="74" y="462">■ STOP always within reach, auto-stop</text>
    </g>

    <!-- ================= Telefon 1: Player ================= -->
    <g transform="translate(520 40)">
      <rect x="-10" y="-10" width="350" height="700" rx="34" fill="#000" stroke="#2c313a"/>
      <g clip-path="url(#scr)">
        <rect width="330" height="680" fill="#111317"/>
        <!-- Kopf -->
        <rect x="12" y="14" width="96" height="26" rx="13" fill="none" stroke="#2c313a"/>
        <text x="24" y="32" font-size="13" fill="#3fb950">connected ▾</text>
        <rect x="290" y="12" width="28" height="28" rx="7" fill="#1b1e24" stroke="#2c313a"/><text x="297" y="32" font-size="16">☰</text>
        <line x1="0" y1="52" x2="330" y2="52" stroke="#2c313a"/>
        <rect x="10" y="62" width="88" height="28" rx="7" fill="none" stroke="#2c313a"/><text x="20" y="81" font-size="13" font-weight="600" fill="#8b929c">← Library</text>
        <!-- Video mit Leiste -->
        <rect x="0" y="100" width="330" height="186" fill="url(#vid)"/>
        <rect x="0" y="206" width="330" height="80" fill="#000" fill-opacity=".45"/>
        <rect x="10" y="214" width="310" height="20" rx="3" fill="url(#heat)" opacity=".85"/>
        <rect x="10" y="238" width="310" height="3" fill="#2c313a"/><rect x="10" y="238" width="118" height="3" fill="#e0457b"/>
        <g font-size="11">
          <rect x="10" y="250" width="28" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="14" y="266">−10</text>
          <rect x="42" y="250" width="28" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="45" y="266">+10</text>
          <text x="78" y="266">0:23 / 1:00</text>
          <rect x="176" y="250" width="22" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="181" y="266">🔊</text>
          <rect x="202" y="250" width="22" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="207" y="266">⟳</text>
          <rect x="228" y="250" width="22" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="232" y="266">🔥</text>
          <rect x="254" y="250" width="38" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="259" y="266">Vib ❚❚</text>
          <rect x="296" y="250" width="24" height="24" rx="6" fill="#ffffff" fill-opacity=".12"/><text x="302" y="266">⛶</text>
        </g>
        <!-- unter dem Video -->
        <rect x="10" y="294" width="196" height="24" rx="6" fill="#1b1e24" stroke="#2c313a"/><text x="18" y="311" font-size="11" fill="#e6e8eb">✨ Picture: <tspan font-weight="700">Auto</tspan> · HQ: <tspan font-weight="700">Auto</tspan> – Settings</text>
        <text x="10" y="344" font-size="16" font-weight="700">Lakeside scene</text>
        <text x="10" y="362" font-size="11" fill="#8b929c">Library folder</text>
        <!-- Geräte-Kasten -->
        <rect x="8" y="374" width="314" height="292" rx="12" fill="#1b1e24" stroke="#2c313a"/>
        <defs>
          <linearGradient id="ivO"><stop offset="0" stop-color="#28c864"/><stop offset=".4" stop-color="#f0d228"/><stop offset=".7" stop-color="#1e90ff"/><stop offset="1" stop-color="#28c864"/></linearGradient>
          <linearGradient id="ivA"><stop offset="0" stop-color="#28c864"/><stop offset=".4" stop-color="#fa821e"/><stop offset=".7" stop-color="#28c864"/><stop offset="1" stop-color="#f0d228"/></linearGradient>
          <linearGradient id="ivS"><stop offset="0" stop-color="#1e3c9f"/><stop offset=".5" stop-color="#1e90ff"/><stop offset="1" stop-color="#1e3c9f"/></linearGradient>
          <linearGradient id="ivI"><stop offset="0" stop-color="#fa821e"/><stop offset=".4" stop-color="#e62832"/><stop offset=".7" stop-color="#fa821e"/><stop offset="1" stop-color="#e62832"/></linearGradient>
        </defs>
        <g><rect x="20" y="382" width="68" height="36" rx="7" fill="#111317" stroke="#2c313a"/><text x="54" y="398" font-size="11" text-anchor="middle" fill="#8b929c">Original</text><rect x="26" y="406" width="56" height="5" rx="2" fill="url(#ivO)"/><rect x="94" y="382" width="68" height="36" rx="7" fill="#e0457b" stroke="#e0457b"/><text x="128" y="398" font-size="11" text-anchor="middle">Automatic</text><rect x="100" y="406" width="56" height="5" rx="2" fill="url(#ivA)"/><rect x="168" y="382" width="68" height="36" rx="7" fill="#111317" stroke="#2c313a"/><text x="202" y="398" font-size="11" text-anchor="middle" fill="#8b929c">Gentle</text><rect x="174" y="406" width="56" height="5" rx="2" fill="url(#ivS)"/><rect x="242" y="382" width="68" height="36" rx="7" fill="#111317" stroke="#2c313a"/><text x="276" y="398" font-size="11" text-anchor="middle" fill="#8b929c">Intense</text><rect x="248" y="406" width="56" height="5" rx="2" fill="url(#ivI)"/></g>
        <g font-size="11" text-anchor="middle">
          <rect x="20" y="426" width="141" height="42" rx="7" fill="#2a2e36"/><text x="90" y="444" font-size="14">✋</text><text x="90" y="461">Yourself</text>
          <rect x="169" y="426" width="141" height="42" rx="7" fill="#2a2e36"/><text x="239" y="444" font-size="14">🔥</text><text x="239" y="461">Highlights</text>
        </g>
        <line x1="20" y1="476" x2="310" y2="476" stroke="#2c313a"/>
        <text x="20" y="504" font-size="12" fill="#8b929c">Offset</text>
        <rect x="182" y="488" width="30" height="26" rx="6" fill="#2a2e36"/><text x="197" y="506" font-size="13" text-anchor="middle">−</text>
        <text x="245" y="506" font-size="12" text-anchor="middle">+40 ms</text>
        <rect x="280" y="488" width="30" height="26" rx="6" fill="#2a2e36"/><text x="295" y="506" font-size="13" text-anchor="middle">+</text>
        <text x="20" y="534" font-size="11" fill="#8b929c">▸ Fine-tune offset</text>
        <line x1="20" y1="550" x2="310" y2="550" stroke="#2c313a"/>
        <rect x="20" y="560" width="290" height="30" rx="7" fill="#6d2a8c"/><text x="165" y="580" font-size="12" font-weight="600" text-anchor="middle">🔥 Finale (gentler)</text>
        <rect x="20" y="600" width="140" height="32" rx="7" fill="#2a2e36"/><text x="90" y="621" font-size="12" font-weight="600" text-anchor="middle">❚❚ Pause</text>
        <rect x="170" y="600" width="140" height="32" rx="7" fill="#c62828"/><text x="240" y="621" font-size="12" font-weight="700" text-anchor="middle">■ Stop everything</text>
      </g>
    </g>

    <!-- ================= Telefon 2: Bibliothek ================= -->
    <g transform="translate(900 40)">
      <rect x="-10" y="-10" width="350" height="700" rx="34" fill="#000" stroke="#2c313a"/>
      <g clip-path="url(#scr)">
        <rect width="330" height="680" fill="#111317"/>
        <text x="12" y="33" font-size="14" font-weight="700">Funscript Player <tspan font-size="10" font-weight="400" fill="#8b929c">v1.19.3</tspan></text>
        <rect x="216" y="14" width="66" height="26" rx="13" fill="none" stroke="#2c313a"/><text x="226" y="32" font-size="12" fill="#3fb950">connected</text>
        <rect x="290" y="12" width="28" height="28" rx="7" fill="#1b1e24" stroke="#2c313a"/><text x="297" y="32" font-size="16">☰</text>
        <line x1="0" y1="52" x2="330" y2="52" stroke="#2c313a"/>
        <rect x="10" y="64" width="310" height="32" rx="7" fill="#1b1e24" stroke="#2c313a"/><text x="20" y="85" font-size="12" fill="#8b929c">Search scenes, titles, files …</text>
        <rect x="10" y="104" width="148" height="28" rx="14" fill="#1b1e24" stroke="#e0457b"/><text x="22" y="123" font-size="11">☑ ⚡ only with Funscript</text>
        <rect x="166" y="104" width="154" height="28" rx="7" fill="#1b1e24" stroke="#2c313a"/><text x="176" y="123" font-size="11">Intensity: all ▾</text>
        <g font-size="11">
          <g transform="translate(10 146)">
            <rect width="150" height="94" rx="8" fill="url(#t2)"/><rect y="90" width="150" height="4" fill="url(#heat)"/>
            <rect x="6" y="6" width="22" height="16" rx="4" fill="#e0457b"/><text x="11" y="18" font-size="10">⚡</text>
            <text x="0" y="112" font-weight="600">Lakeside scene</text><text x="0" y="128" fill="#8b929c">25 min · medium</text>
          </g>
          <g transform="translate(170 146)">
            <rect width="150" height="94" rx="8" fill="url(#t1)"/><rect y="90" width="150" height="4" fill="url(#heat)"/>
            <rect x="6" y="6" width="22" height="16" rx="4" fill="#e0457b"/><text x="11" y="18" font-size="10">⚡</text>
            <text x="0" y="112" font-weight="600">Rooftop</text><text x="0" y="128" fill="#8b929c">16 min · intense</text>
          </g>
        </g>
        <g font-size="11">
          <g transform="translate(10 300)">
            <rect width="150" height="94" rx="8" fill="url(#t3)"/><rect y="90" width="150" height="4" fill="url(#heat)"/>
            <rect x="6" y="6" width="22" height="16" rx="4" fill="#e0457b"/><text x="11" y="18" font-size="10">⚡</text>
            <rect x="32" y="6" width="22" height="16" rx="4" fill="#000" fill-opacity=".6"/><text x="37" y="18" font-size="10">✋</text>
            <text x="0" y="112" font-weight="600">After work</text><text x="0" y="128" fill="#8b929c">31 min · intense</text>
          </g>
          <g transform="translate(170 300)">
            <rect width="150" height="94" rx="8" fill="url(#t1)"/><rect y="90" width="150" height="4" fill="#1e90ff"/>
            <rect x="6" y="6" width="22" height="16" rx="4" fill="#e0457b"/><text x="11" y="18" font-size="10">⚡</text>
            <rect x="112" y="6" width="32" height="16" rx="4" fill="#3fb950"/><text x="116" y="18" font-size="10">New</text>
            <text x="0" y="112" font-weight="600">Hotel room</text><text x="0" y="128" fill="#8b929c">18 min · gentle</text>
          </g>
          <g transform="translate(10 448)">
            <rect width="150" height="94" rx="8" fill="url(#t2)"/><rect y="90" width="150" height="4" fill="url(#heat)"/>
            <rect x="6" y="6" width="22" height="16" rx="4" fill="#e0457b"/><text x="11" y="18" font-size="10">⚡</text>
            <rect x="32" y="6" width="22" height="16" rx="4" fill="#000" fill-opacity=".6"/><text x="37" y="18" font-size="10">🎯</text>
            <text x="0" y="112" font-weight="600">Night train</text><text x="0" y="128" fill="#8b929c">22 min · medium</text>
          </g>
          <g transform="translate(170 448)">
            <rect width="150" height="94" rx="8" fill="url(#t3)"/><rect y="90" width="150" height="4" fill="url(#heat)"/>
            <rect x="6" y="6" width="22" height="16" rx="4" fill="#e0457b"/><text x="11" y="18" font-size="10">⚡</text>
            <text x="0" y="112" font-weight="600">Summer house</text><text x="0" y="128" fill="#8b929c">12 min · intense</text>
          </g>
        </g>
        <!-- Mini-Player -->
        <rect x="10" y="610" width="310" height="52" rx="10" fill="#1b1e24" stroke="#2c313a"/>
        <rect x="20" y="620" width="32" height="32" rx="16" fill="#e0457b"/><text x="31" y="641" font-size="12">❚❚</text>
        <text x="62" y="634" font-size="12" font-weight="600">Lakeside scene</text><text x="62" y="650" font-size="10" fill="#8b929c">Back to the video ↑</text>
      </g>
    </g>
  </g>
</svg>
