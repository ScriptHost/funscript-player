name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [FAQ](https://github.com/ScriptHost/funscript-player#-faq--troubleshooting) first.
        **Don't post connection keys, Application IDs, passwords or private URLs.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open a scene with a Funscript
        2. Press play
        3. …
  - type: input
    id: version
    attributes:
      label: Version
      description: ⚙️ → System (e.g. 2.0.0, or "edge")
    validations:
      required: true
  - type: dropdown
    id: devices
    attributes:
      label: Devices
      multiple: true
      options:
        - The Handy – Wi-Fi (API v2, no Application ID)
        - The Handy – Wi-Fi (API v3, with Application ID)
        - The Handy – Bluetooth via Intiface
        - Satisfyer – Bluetooth in the browser
        - Satisfyer – via Intiface
        - No device
  - type: input
    id: browser
    attributes:
      label: Device & browser
      placeholder: e.g. Pixel 8, Chrome 142 – or Windows 11, Edge
  - type: dropdown
    id: library
    attributes:
      label: Library
      multiple: true
      options:
        - Stash
        - Folders (/media)
        - HereSphere (VR)
  - type: textarea
    id: logs
    attributes:
      label: docker logs
      description: Output of `docker logs Funscript-Player` around the problem (remove private addresses)
      render: text
