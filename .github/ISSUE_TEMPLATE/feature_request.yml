name: 💡 Feature idea
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why – what problem does it solve?
  - type: dropdown
    id: where
    attributes:
      label: Where in the player?
      multiple: true
      options:
        - Library
        - Player
        - Devices (Handy, Satisfyer)
        - Script intensity
        - Settings
        - VR (HereSphere)
        - Docker / installation
