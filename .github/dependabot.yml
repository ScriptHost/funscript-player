# Hält GitHub-Actions, Node-Basis-Image und die ESLint-Pakete aktuell – einmal im Monat, je Bereich EIN gebündelter
# Pull Request (Actions alle zusammen, Docker, npm alle zusammen).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  # ESLint für die Code-Prüfung auf GitHub (package.json – nicht im Image)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      lint:
        patterns: ['*']
