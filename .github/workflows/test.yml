# Tests bei jedem Push auf main und bei Pull Requests – Fehler fallen so schon vor dem Release-Tag auf
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node --test "test/*.test.js"   # inkl. Browser-Selbsttest in Chrome (test/browser.test.js)
      # Code-Prüfung (1.19.9): nur hier, nicht im Image
      - run: npm ci --no-audit --no-fund && npx eslint .   # Versionen fest in package-lock.json

  # Test-Image (seit 1.19.9): jeder Push auf main nach grünen Tests -> ghcr.io/…:edge.
  # Zum Ausprobieren auf dem Server ohne Release; „latest“ und Versionsnummern gibt es nur mit einem Release-Tag.
  edge:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ghcr.io/scripthost/funscript-player:edge
