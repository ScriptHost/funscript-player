# Release je Versions-Tag: ZIP (funscript-player-vX.Y.Z.zip, bis 1.x handy-player-linux-…) + Text aus CHANGELOG.md (englisch, Stand main)
# + Docker-Image auf GitHub (ghcr.io/scripthost/funscript-player:X.Y.Z und :latest, amd64 + arm64).
#   Vorabversion (Tag mit „-“, z. B. v2.0.0-beta1): „Pre-release“, Image nur mit Versionsnummer, :latest bleibt.
#   Neuer Tag            -> nur dieser.
#   Manuell (Actions -> Release -> Run workflow):
#     recreate = false   -> alle Tags ohne Release nachholen
#     recreate = true    -> ALLE Releases löschen und neu erzeugen (englischer Text, ZIP aus dem jeweiligen Tag)
#   Dasselbe beim Tag: steht „[alle Releases neu]“ in der Tag-Nachricht, werden alle Releases neu erzeugt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      recreate:
        description: 'Alle Releases löschen und neu erzeugen'
        type: boolean
        default: false

# Nur Lesen als Standard – Schreibrechte bekommt nur der Job, der sie braucht
permissions:
  contents: read

jobs:
  # Erst testen – Release und Image gibt es nur, wenn alle Tests grün sind
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node --test "test/*.test.js"   # inkl. Browser-Selbsttest in Chrome (test/browser.test.js)
      # Code-Prüfung (1.19.9): nur hier, nicht im Image
      - run: npm ci --no-audit --no-fund && npx eslint .   # Versionen fest in package-lock.json

  # Container so starten, wie die docker-compose.yml es vorgibt (schreibgeschützt, ohne Linux-Rechte),
  # und prüfen, dass Selbsttest und Oberfläche laufen
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build und Start
        run: |
          docker build -q -t fsp-test .
          docker run -d --name fsp --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 2g -e LOGIN=off -v fsp-data:/app/data -p 8080:8080 fsp-test
          for i in $(seq 1 60); do docker logs fsp 2>&1 | grep -q "✓ ready" && break; sleep 1; done
          docker logs fsp 2>&1
          docker logs fsp 2>&1 | grep -q "✓ ready"
          r=$(docker logs fsp 2>&1 | grep -oE "Self-test: [0-9]+/[0-9]+" | cut -d' ' -f2)
          [ -n "$r" ] && [ "${r%/*}" = "${r#*/}" ]
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "main.js"

  release:
    needs: [test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release anlegen
      id-token: write   # Signatur ohne eigenen Schlüssel (Sigstore)
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          RECREATE: ${{ inputs.recreate }}
        run: |
          git fetch --force --tags -q   # Tag-Nachrichten vollständig (checkout macht den Tag sonst „leicht“)
          git show origin/main:CHANGELOG.md > changelog.en.md
          # Vorabversionen (Tag mit „-“, z. B. v2.0.0-beta1): Release als „Pre-release“, nie „Latest“, Image ohne :latest.
          # versionsort.suffix: v2.0.0-beta1 sortiert VOR v2.0.0
          vsort() { git -c versionsort.suffix=- tag --sort=v:refname; }
          newest=$(vsort | grep -v -- - | tail -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags="$GITHUB_REF_NAME"; else tags=$(vsort); fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && git tag -l --format="%(contents)" "$GITHUB_REF_NAME" | grep -qF "[alle Releases neu]"; then
            RECREATE=true; tags=$(vsort)
          fi
          # Fehler einer Version als Hinweis (öffentlich lesbar, auch ohne Anmeldung) melden und weitermachen
          fail=0
          err() { echo "::error title=$1::$(tr '\n' ' ' < err.txt | cut -c1-400)"; fail=1; }
          # GitHub antwortet manchmal mit 502 – bis zu 4 Versuche
          retry() { for i in 1 2 3 4; do "$@" 2>err.txt && return 0; sleep $((i * 10)); done; return 1; }
          for t in $tags; do
            if gh release view "$t" >/dev/null 2>&1; then
              if [ "$RECREATE" != "true" ]; then echo "$t: Release gibt es schon"; continue; fi
              # schon im neuen Format (englisch, mit Image-Hinweis)? dann bleibt es – ein Entwurf (entsteht, wenn
              # ein Tag neu gesetzt wird oder GitHub beim Anlegen hängt) wird veröffentlicht
              if gh release view "$t" --json body -q .body | grep -qF "ghcr.io/scripthost/funscript-player"; then
                if [ "$(gh release view "$t" --json isDraft -q .isDraft)" = "true" ]; then
                  if [ "$t" = "$newest" ]; then latest="--latest"; else latest="--latest=false"; fi
                  retry gh release edit "$t" --draft=false $latest || err "$t veröffentlichen"
                  echo "$t: Entwurf veröffentlicht"
                else echo "$t: schon neu"; fi
                continue
              fi
              retry gh release delete "$t" --yes || { err "$t löschen"; continue; }
            fi
            v="${t#v}"
            # ZIP-Name: ab 2.0 funscript-player-vX.Y.Z.zip (Ordner funscript-player), 1.x behält den alten Namen
            case "$t" in
              v1.*) zip="handy-player-linux-$t.zip"; dir="handy-player" ;;
              *) zip="funscript-player-$t.zip"; dir="funscript-player" ;;
            esac
            # Oben fester Block „Install / update“, darunter der Text aus CHANGELOG.md
            pre=""; upd='`docker compose pull && docker compose up -d`'
            case "$v" in *-*)
              pre="--prerelease"
              upd="set \`PLAYER_VERSION=$v\` in \`.env\`, then \`docker compose pull && docker compose up -d\` (back to stable: \`PLAYER_VERSION=latest\`)" ;;
            esac
            {
              [ -n "$pre" ] && printf '> **Pre-release** – `:latest` stays on the last stable version.\n\n'
              printf '**Install:** download `%s` below → `unzip %s && cd %s` → `cp .env.example .env` → edit `.env` → `docker compose up -d` ([README](https://github.com/ScriptHost/funscript-player#-quick-start))  \n' "$zip" "$zip" "$dir"
              printf '**Update:** %s – your `.env` and data stay.\n\n---\n\n' "$upd"
              awk -v v="$v" 'index($0, "## " v " ") == 1 || $0 == "## " v { f = 1; next } /^## / && f { exit } f' changelog.en.md > body.md
              if [ -s body.md ]; then cat body.md; else echo "Version $v"; fi
              printf '\n---\nDocker image `ghcr.io/scripthost/funscript-player:%s` (amd64 + arm64)\n' "$v"
            } > notes.md
            git archive --format=zip --prefix="$dir/" -o "$zip" "$t" -- . ':!.gitignore' ':!windows' ':!.github' 2>err.txt || { err "$t ZIP"; continue; }
            # Prüfsumme zum Nachrechnen: sha256sum -c funscript-player-vX.Y.Z.zip.sha256
            sha256sum "$zip" > "$zip.sha256"
            # Signatur (Sigstore, an diesen Workflow gebunden): cosign verify-blob --bundle <zip>.sigstore.json …
            # Klappt die Signatur nicht, kommt das Release trotzdem (mit Warnung) – nie ein fehlendes Release deswegen
            sig="$zip.sigstore.json"
            cosign sign-blob --yes --bundle "$sig" "$zip" >/dev/null 2>err.txt || { echo "::warning title=$t Signatur::$(tr '\n' ' ' < err.txt | cut -c1-300)"; sig=""; }
            printf '\nSHA-256 of the ZIP: `%s` – the image comes with an SBOM and a build provenance attestation.\n' "$(cut -d' ' -f1 "$zip.sha256")" >> notes.md
            if [ "$t" = "$newest" ]; then latest="--latest"; else latest="--latest=false"; fi
            retry gh release create "$t" "$zip" "$zip.sha256" $sig --title "$v" --notes-file notes.md $latest $pre || { err "$t anlegen"; continue; }
            echo "$t: Release erstellt"
          done
          exit $fail

  image:
    # Docker-Image nur für einen neuen Tag (bzw. beim manuellen Lauf für den neuesten)
    needs: [test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Image hochladen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          t="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || t=$(git -c versionsort.suffix=- tag --sort=v:refname | tail -1)
          git checkout -q "$t"
          echo "version=${t#v}" >> "$GITHUB_OUTPUT"
          # Vorabversion (z. B. 2.0.0-beta1): nur die Versionsnummer, :latest bleibt auf der letzten stabilen
          case "$t" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac
      # ARM64 (2.0): Apple silicon, Raspberry Pi … – gebaut über QEMU auf dem amd64-Runner
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # SBOM und Herkunftsnachweis gehen nur mit dem buildx-Container-Treiber (nicht mit dem Standard-„docker“-Treiber)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Software-Stückliste (SBOM) und Herkunftsnachweis (wo und woraus gebaut) hängen am Image
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/scripthost/funscript-player:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && 'ghcr.io/scripthost/funscript-player:latest' || '' }}
