# Sicherheits-Analyse von GitHub (CodeQL) – bei jedem Push auf main, bei Pull Requests und einmal pro Woche.
# Funde erscheinen im Reiter „Security → Code scanning“ (nur für Berechtigte sichtbar).
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Funde hochladen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # Tests und das Skript für die README-Grafiken laufen nie auf dem Server – nicht mitprüfen
          config: |
            paths-ignore:
              - test
              - docs
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
