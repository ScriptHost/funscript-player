# EINMALIG (1.19.9 → 2.0): alte GitHub-Release-Seiten löschen, nur das neueste Release bleibt.
# Die Git-Tags und Docker-Images bleiben erhalten. Läuft nur, wenn diese Datei selbst gepusht wird –
# danach wird sie wieder entfernt.
name: Alte Releases aufräumen

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-releases.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Releases außer dem neuesten löschen (Tags bleiben)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          keep=$(gh release view --json tagName -q .tagName)   # das als „Latest“ markierte
          echo "bleibt: $keep"
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            [ "$t" = "$keep" ] && continue
            for i in 1 2 3; do gh release delete "$t" --yes && break; sleep 5; done
            echo "gelöscht: $t"
          done
