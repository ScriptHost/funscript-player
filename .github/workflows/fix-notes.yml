# EINMALIG (Nutzer 04.11.2026): interne Zeilen aus den Release-Texten von 1.19.10 und 1.19.11 entfernen.
# Läuft nur, wenn diese Datei selbst gepusht wird – danach wird sie wieder entfernt.
name: Release-Texte bereinigen

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-notes.yml']

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Interne Zeilen streichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in v1.19.10 v1.19.11; do
            gh release view "$t" --json body -q .body > old.md
            node -e '
              let s = require("fs").readFileSync("old.md", "utf8");
              s = s.replace(/^- Code check: ESLint[^\n]*\n[^\n]*SECURITY\.md[^\n]*\n/m, "");
              s = s.replace("Security fixes from GitHub code scanning (CodeQL) – all low risk:", "Security fixes – all low risk:");
              s = s.replace("- Code scanning ignores tests and the README graphics script; Stash IDs in requests are always encoded", "- Stash IDs in requests are always encoded");
              require("fs").writeFileSync("new.md", s);
            '
            if cmp -s old.md new.md; then echo "$t: nichts zu ändern"; else gh release edit "$t" --notes-file new.md && echo "$t: bereinigt"; fi
          done
