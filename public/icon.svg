<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 2.0 „Graphit + Neon“: Play-Dreieck mit Neon-Rand (Cyan = The Handy, Pink = Satisfyer), darunter ein Script-Verlauf -->
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#b46cff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".42" r=".7">
      <stop offset="0" stop-color="#1c1b22"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M206 132 L364 226 Q378 234 364 242 L206 336 Q190 345 190 328 L190 140 Q190 123 206 132 Z"
        fill="#16151b" stroke="url(#n)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M112 404 L150 380 L182 418 L222 360 L262 422 L300 372 L336 410 L370 388 L400 404"
        fill="none" stroke="url(#n)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".9" filter="url(#glow)"/>
</svg>
